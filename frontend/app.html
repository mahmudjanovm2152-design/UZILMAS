<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#FFFFFF">
<title>Uzilmas · Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="icon" href="/static/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/static/uzilmas.css">
<style>
  body { background: var(--bg); }
  .app { max-width: 520px; margin: 0 auto; padding: 18px 16px 32px; }
  .head { display: flex; align-items: center; justify-content: space-between; }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo img { width: 48px; height: 48px; border-radius: 12px; }
  .logo b { font-size: 22px; color: var(--ink); letter-spacing: -.02em; display: block; line-height: 1.1; }
  .logo span { font-size: 13px; color: var(--muted); }
  .stat { margin-top: 18px; padding: 14px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat div { font-size: 12.5px; color: var(--muted); } .stat b { display: block; font-size: 24px; color: var(--ink); line-height: 1.15; }
  .stat .bad b { color: var(--red); }
  h1 { font-size: 22px; margin: 22px 0 4px; } .sub { color: var(--muted); margin: 0 0 14px; font-size: 14.5px; }
  .role { display: flex; gap: 14px; align-items: center; padding: 16px; margin-bottom: 10px; transition: border-color .15s; }
  .role:active { border-color: var(--blue); }
  .role .ico { width: 48px; height: 48px; border-radius: 12px; background: var(--blue-50); color: var(--blue); display: grid; place-items: center; flex: none; }
  .role .ico svg { width: 24px; height: 24px; }
  .role h3 { font-size: 16.5px; } .role p { margin: 2px 0 0; font-size: 13.5px; color: var(--muted); }
  .role .chev { margin-left: auto; color: var(--faint); }
  .more { display: block; text-align: center; margin-top: 16px; color: var(--blue); font-weight: 600; font-size: 14.5px; }
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <div class="logo"><img src="/static/logo-mark.png" alt=""><div><b>Uzilmas</b><span id="slogan"></span></div></div>
    <div id="lang"></div>
  </div>
  <div class="card stat">
    <div><span id="l-total"></span><b id="s-total">—</b></div>
    <div class="bad"><span id="l-broken"></span><b id="s-broken">—</b></div>
  </div>
  <h1 id="h"></h1><p class="sub" id="sub"></p>
  <div id="roles"></div>
  <a class="more" href="/" id="more"></a>
</div>
<script src="/static/i18n-ru.js"></script>
<script src="/static/common.js"></script>
<script>
document.title = t("Uzilmas · Mini App");
document.getElementById("lang").innerHTML = langSwitch();
document.getElementById("slogan").textContent = t("Bemor zanjiri uzilmaydi");
document.getElementById("l-total").textContent = t("Hozir kuzatuvda");
document.getElementById("l-broken").textContent = t("Uzilgan zanjirlar");
document.getElementById("h").textContent = t("Kim sifatida kirasiz?");
document.getElementById("sub").textContent = t("Rolingizni tanlang — kerakli ekran oçiladi.");
document.getElementById("more").textContent = t("Platforma haqida");
document.getElementById("roles").innerHTML = [
  ["/nurse", "user", t("Hamşira"), t("Taşrif ma'lumotlarini kiritiş (rasm, ovoz, qölda)")],
  ["/dashboard", "grid", t("Mutaxassis paneli"), t("Xavf zonalari, jonli zanjir, ogohlantirişlar")],
  ["/doctor", "steth", t("Oilaviy şifokor"), t("Aktiv çaqiruvlar va 24 soatlik taymer")],
].map(([h, i, title, p]) => `<a class="card role" href="${h}" onclick="haptic('success')"><div class="ico">${ic(i)}</div>
  <div><h3>${title}</h3><p>${p}</p></div><span class="chev">${ic("arrow", 18)}</span></a>`).join("");
api("/api/stats").then(s => {
  document.getElementById("s-total").textContent = s.total;
  document.getElementById("s-broken").textContent = s.chains.broken;
}).catch(() => {});
</script>
</body>
</html>
